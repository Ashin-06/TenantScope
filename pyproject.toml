[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantscope"
version = "1.0.0"
description = "Exercise authorization across ownership lifecycles with an independent oracle."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ashin Murugan"}]
dependencies = []

[project.scripts]
tenantscope = "tenantscope.entry:main"

[tool.setuptools.packages.find]
include = ["tenantscope*"]

[tool.setuptools.package-data]
tenantscope = ["static/*"]
